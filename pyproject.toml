[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logic-alpha-tm"
version = "0.1.0"
description = "Interpretable, leakage-aware market strategy selection research"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
tm = ["tmu==0.8.3", "numpy>=1.26,<2", "scipy>=1.10,<1.13", "scikit-learn>=1.3,<1.6"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
logic-alpha = "logic_alpha_tm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
